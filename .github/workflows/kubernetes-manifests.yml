name: Kubernetes manifests
on:
  pull_request:
    paths: [deploy/kustomize/**, .github/workflows/kubernetes-manifests.yml]
  push:
    branches: [main]
    paths: [deploy/kustomize/**, .github/workflows/kubernetes-manifests.yml]
permissions: {contents: read}
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: imranismail/setup-kustomize@v2
        with: {kustomize-version: v5.6.0}
      - run: kustomize build deploy/kustomize/overlays/test > rendered.yaml
      - name: Validate Kubernetes schemas
        run: |
          docker run --rm -v "$PWD:/work" ghcr.io/yannh/kubeconform:v0.6.7 \
            -strict -ignore-missing-schemas /work/rendered.yaml
