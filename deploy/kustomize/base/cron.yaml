apiVersion: apps/v1
kind: Deployment
metadata: {name: cron}
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: cron}}
  template:
    metadata: {labels: {app.kubernetes.io/name: cron}}
    spec:
      containers:
        - name: cron
          image: registry.invalid/gosmetch/cron:sha-CHANGE_ME
          envFrom:
            - configMapRef: {name: gosmetch-config}
            - secretRef: {name: gosmetch-secrets}
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: "1", memory: 1Gi}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
