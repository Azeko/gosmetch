apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres
spec:
  instances: 1

  imageName: ghcr.io/cloudnative-pg/postgis:17-3-standard-trixie

  storage:
    size: 10Gi
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: app-db
spec:
  name: app
  owner: app
  cluster:
    name: postgres
  extensions:
    - name: postgis
      ensure: present
    - name: vector
      ensure: present
    - name: pg_trgm
      ensure: present
    - name: btree_gist
      ensure: present
    - name: uuid-ossp
      ensure: present
