apiVersion: v1
kind: Service
metadata: {name: firehol}
spec:
  selector: {app.kubernetes.io/name: firehol}
  ports: [{name: http, port: 5070, targetPort: http}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: firehol}
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: firehol}}
  template:
    metadata: {labels: {app.kubernetes.io/name: firehol}}
    spec:
      containers:
        - name: firehol
          image: registry.invalid/gosmetch/firehol:sha-CHANGE_ME
          ports: [{name: http, containerPort: 5070}]
          readinessProbe: {httpGet: {path: /health, port: http}, initialDelaySeconds: 5}
          livenessProbe: {httpGet: {path: /health, port: http}, initialDelaySeconds: 15}
          resources:
            requests: {cpu: 25m, memory: 64Mi}
            limits: {cpu: 200m, memory: 256Mi}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
