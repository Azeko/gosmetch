apiVersion: v1
kind: Service
metadata:
  name: redis
spec:
  selector: {app.kubernetes.io/name: redis}
  ports:
    - {name: redis, port: 6379, targetPort: redis}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
spec:
  serviceName: redis
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: redis}
  template:
    metadata:
      labels: {app.kubernetes.io/name: redis}
    spec:
      securityContext: {fsGroup: 1000, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: redis
          image: redis:7.4.2-alpine
          args: [redis-server, --appendonly, "yes", --save, "60", "1"]
          ports: [{name: redis, containerPort: 6379}]
          readinessProbe: {tcpSocket: {port: redis}, initialDelaySeconds: 2, periodSeconds: 5}
          livenessProbe: {tcpSocket: {port: redis}, initialDelaySeconds: 10, periodSeconds: 10}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 250m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            runAsNonRoot: true
            runAsUser: 1000
          volumeMounts: [{name: data, mountPath: /data}]
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        resources: {requests: {storage: 2Gi}}
