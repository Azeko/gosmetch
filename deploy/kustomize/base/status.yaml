apiVersion: v1
kind: Service
metadata: {name: status}
spec:
  selector: {app.kubernetes.io/name: status}
  ports: [{name: http, port: 8080, targetPort: http}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: status}
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: status}}
  template:
    metadata: {labels: {app.kubernetes.io/name: status}}
    spec:
      containers:
        - name: status
          image: registry.invalid/gosmetch/status:sha-CHANGE_ME
          ports: [{name: http, containerPort: 8080}]
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 100m, memory: 64Mi}
