apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: gosmetch-test
resources:
  - ../../base
  - namespace.yaml
patches:
  - path: hosts.yaml
images:
  - {name: registry.invalid/gosmetch/api, newName: cr.yandex/REGISTRY_ID/gosmetch/api, newTag: sha-CHANGE_ME}
  - {name: registry.invalid/gosmetch/cron, newName: cr.yandex/REGISTRY_ID/gosmetch/cron, newTag: sha-CHANGE_ME}
  - {name: registry.invalid/gosmetch/firehol, newName: cr.yandex/REGISTRY_ID/gosmetch/firehol, newTag: sha-CHANGE_ME}
  - {name: registry.invalid/gosmetch/frontend, newName: cr.yandex/REGISTRY_ID/gosmetch/frontend, newTag: sha-CHANGE_ME}
  - {name: registry.invalid/gosmetch/status, newName: cr.yandex/REGISTRY_ID/gosmetch/status, newTag: sha-CHANGE_ME}
